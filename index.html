<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8ff" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="./icon.png" type="image/png" sizes="128x128" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>Keypals</title>
    <!-- the loading screen's picture comes first, before the game's code -->
    <link rel="preload" as="image" href="./brand/boot-island.webp" fetchpriority="high" />
    <style>
      /* The loading screen: painted straight away from this page alone (no waiting for the game's code), the
         sky and the island the title stands on, the Keypals keys and a gentle "Loading...". When the game
         starts, the words give way to the title's own (in the same place), and the picture stays under the
         title until the 3D island is ready, then fades (App.svelte). */
      html, body { margin: 0; height: 100%; }
      body { background: #79aef0; }
      /* (a tiny copy of the picture, inside this page, shows at once; the real one sharpens it when it arrives) */
      #kp-boot { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: url(data:image/webp;base64,UklGRmYBAABXRUJQVlA4IFoBAABwBwCdASooABkAPu1mqE8ppaOiKqwBMB2JbAC2+207QQz58AWzkUIbMO5M8yIWnMX/eeC6B1rzkKr++qGLoDcu56xWwADTPjspORd6e6qaQX9pNWA2yVULtctJUKkNtS7oVjMeWVgxdB9uyckuBNs44um7P3CEg49VOZSgZPaHIJR7Tj21Ghm31V1hkepGqjYo/MdFX0A1maRf+ZvzBBkjXv4Ml9FCATK6xmfCi+xMdeD2BNwISBxxWcB1S05NqUU5H6hp6/vZ+VAQL9yql646wLNuALJRpYmXxr0QaICnbiNIjJtQsuiyx+/YNYRJfAPAnE3Uz7TJPitMlL80KT7E+sNpusFyIdj1+BZ18BN1Jh5WX4NkRYWIxv3RsW89jFrlSz8jFuJwAgcDCu24faVPL3OQvnWtz8tQ/ub+XGSP/MRcXrMgG31eQGlmFhlJyIn7+AZhZoZXAAAA) 50% 100% / cover, linear-gradient(#5f93ea, #8fc0f4 45%, #cfe5f8 70%, #8cbf5a 71%); transition: opacity .6s ease; font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif; color: #2b2140; }
      #kp-boot.gone { opacity: 0; pointer-events: none; }
      #kp-boot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; }
      .kb-top { position: absolute; left: 0; right: 0; top: 7%; display: flex; flex-direction: column; align-items: center; gap: 14px; --sz: min(78px, 8.5vh, calc((100vw - 40px) / 7.6)); }
      .kp-up .kb-top { display: none; }
      .kb-logo { display: flex; gap: calc(var(--sz) * .08); }
      .kb-logo b { display: grid; place-items: center; width: calc(var(--sz) * 1.06); height: calc(var(--sz) * 1.12); border-radius: calc(var(--sz) * .26); font: 700 var(--sz)/1 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif; background: linear-gradient(#fff, var(--c)); box-shadow: 0 calc(var(--sz) * .1) 0 rgba(107, 90, 154, .55), 0 calc(var(--sz) * .2) calc(var(--sz) * .3) calc(var(--sz) * -.12) rgba(50, 30, 90, .45); animation: kb-press 2.4s ease-in-out infinite; }
      .kb-pill { margin: 6px 0 0; font-size: 22px; font-weight: 600; background: rgba(255, 255, 255, .85); padding: 6px 18px; border-radius: 999px; }
      .kb-pill i { display: inline-block; animation: kb-dot 1.2s ease-in-out infinite; }
      .kb-pill i + i { animation-delay: .2s; } .kb-pill i + i + i { animation-delay: .4s; }
      .kb-slow { display: none; max-width: min(440px, 88vw); margin: 4px 0 0; padding: 10px 16px; border-radius: 18px; background: rgba(255, 255, 255, .92); font: 600 16px/1.35 system-ui, sans-serif; text-align: center; }
      .kb-slow button { margin-top: 8px; font: 600 17px system-ui, sans-serif; border: 0; border-radius: 999px; padding: 8px 18px; background: #7c5cf5; color: #fff; cursor: pointer; }
      @keyframes kb-press { 0%, 80%, 100% { transform: none; } 88% { transform: translateY(calc(var(--sz) * .07)); } }
      @keyframes kb-dot { 50% { opacity: .2; } }
      @media (prefers-reduced-motion: reduce) { .kb-logo b, .kb-pill i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="kp-boot" aria-hidden="true">
      <img src="./brand/boot-island.webp" alt="" />
      <div class="kb-top">
        <div class="kb-logo"><b style="--c:hsl(228 65% 82%)">K</b><b style="--c:hsl(200 70% 78%);animation-delay:.1s">E</b><b style="--c:hsl(100 50% 74%);animation-delay:.2s">Y</b><b style="--c:hsl(322 62% 82%);animation-delay:.3s">P</b><b style="--c:hsl(345 70% 82%);animation-delay:.4s">A</b><b style="--c:hsl(290 50% 82%);animation-delay:.5s">L</b><b style="--c:hsl(268 62% 84%);animation-delay:.6s">S</b></div>
        <p class="kb-pill">Loading<i>.</i><i>.</i><i>.</i></p>
        <p class="kb-slow" id="kb-slow"></p>
      </div>
    </div>
    <div id="app"></div>
    <script>
      // If the game can't start (for example on an old Mac's browser engine), show what went
      // wrong instead of a blank window. Plain old JavaScript on purpose, so it always runs.
      (function () {
        var errs = [];
        function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
        window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
        window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
        function show(why) {
          if (document.getElementById('kp-err')) return;
          var d = document.createElement('div');
          d.id = 'kp-err';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#fbf8ff;color:#2b2140;font:16px -apple-system,Helvetica,sans-serif;padding:36px;overflow:auto';
          var css = window.CSS && CSS.supports;
          var feats = 'inset:' + (css && CSS.supports('inset', '0') ? 'yes' : 'no') + ' aspect-ratio:' + (css && CSS.supports('aspect-ratio', '1') ? 'yes' : 'no') + ' structuredClone:' + (typeof window.structuredClone);
          d.innerHTML = '<h2 style="margin:0 0 6px">Keypals could not start</h2><p style="margin:0 0 14px">Please take a photo of this screen and send it to the grown-up who set up the game.</p><p><b>' + esc(why) + '</b></p><pre style="white-space:pre-wrap;font:13px Menlo,monospace;background:#fff;border:2px solid #e4dcf2;border-radius:12px;padding:12px">' + esc(errs.join('\n') || 'No error message.') + '\n\n' + esc(navigator.userAgent) + '\n' + feats + '</pre>';
          document.body.appendChild(d);
        }
        // a slow line: say so on the loading screen, and after a long while offer to load the page again
        var t0 = Date.now(), arrived = false;
        // (the game's code has downloaded and run once this fires)
        document.addEventListener('DOMContentLoaded', function () { arrived = true; });
        function slowNote() {
          var n = document.getElementById('kb-slow');
          if (!n || window.__keypalsStarted) return;
          var s = (Date.now() - t0) / 1000;
          if (s > 60) n.innerHTML = 'This is taking a long time. Check the internet, then<br><button type="button" onclick="location.reload()">Try again</button>';
          else if (s > 12) n.textContent = 'Still loading. On a slow connection this can take a minute.';
          else return;
          n.style.display = 'block';
        }
        // check every few seconds: while the game's code is still downloading it's not a failure (a slow line,
        // or the dev server compiling); once it has arrived, the game gets 20 seconds to show its first screen
        var tries = 0;
        (function check() {
          var m = document.querySelector('main.app'), s = m && m.firstElementChild;
          var ok = window.__keypalsStarted && s && s.getBoundingClientRect().height >= 10;
          if (ok) return;
          slowNote();
          var waiting = !arrived && !errs.length && Date.now() - t0 < 300000;
          if (waiting || ++tries < 5) { setTimeout(check, 4000); return; }
          show(!window.__keypalsStarted ? 'The game code did not start.' : 'The game started but the screen has no size.');
        })();
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
